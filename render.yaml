services:
  - type: web
    name: backend
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && npm test && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: npm start
    healthCheckPath: /teste
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
